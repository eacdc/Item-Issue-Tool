# Render Blueprint: a static site built from this repo.
# Set VITE_API_BASE_URL in the Render dashboard (it is baked in at build time).
services:
  - type: web
    name: cdc-item-issue-tool
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
